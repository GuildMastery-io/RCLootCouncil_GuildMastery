name: Release

# Standalone packaging: on every `vX.Y.Z` tag pushed, build the addon zip
# (RCLootCouncil_GuildMastery/ folder) and attach it to a GitHub release.
# No external service required (CurseForge/WoWInterface not needed).
# Same principle as the GuildMastery Sync companion (tag -> release + artifact).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches .toc version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TOC_VERSION="$(grep -iE '^## Version:' RCLootCouncil_GuildMastery.toc | sed 's/.*: *//' | tr -d '\r' | xargs)"
          echo "tag=$VERSION  toc=$TOC_VERSION"
          if [ "$VERSION" != "$TOC_VERSION" ]; then
            echo "::error::Tag ($VERSION) does not match the .toc version ($TOC_VERSION). Align both before tagging."
            exit 1
          fi

      - name: Build addon zip
        id: build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="RCLootCouncil_GuildMastery"
          STAGE="dist/${PKG}"
          mkdir -p "${STAGE}"
          # Shipped files (the rest is ignored via .pkgmeta: .git, .github,
          # README, CHANGELOG, openspec...). The zip extracts into Interface/AddOns/.
          cp RCLootCouncil_GuildMastery.toc core.lua History.lua "${STAGE}/"
          cp -r Media "${STAGE}/"
          ( cd dist && zip -r "../${PKG}-${VERSION}.zip" "${PKG}" )
          echo "zip=${PKG}-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## ${VERSION}" '
            index($0, v) == 1 { flag=1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "RCLootCouncil_GuildMastery ${VERSION}" > RELEASE_NOTES.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
