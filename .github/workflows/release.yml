name: Release

# Packaging autonome : à chaque tag `vX.Y.Z` poussé, on construit le zip de
# l'addon (dossier RCLootCouncil_GuildMastery/) et on l'attache à une release
# GitHub. Aucun service externe requis (CurseForge/WoWInterface non nécessaires).
# Même principe que le companion GuildMastery Sync (tag → release + artefact).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier que le tag == version du .toc
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TOC_VERSION="$(grep -iE '^## Version:' RCLootCouncil_GuildMastery.toc | sed 's/.*: *//' | tr -d '\r' | xargs)"
          echo "tag=$VERSION  toc=$TOC_VERSION"
          if [ "$VERSION" != "$TOC_VERSION" ]; then
            echo "::error::Le tag ($VERSION) ne correspond pas à la version du .toc ($TOC_VERSION). Aligne les deux avant de tagger."
            exit 1
          fi

      - name: Construire le zip de l'addon
        id: build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="RCLootCouncil_GuildMastery"
          STAGE="dist/${PKG}"
          mkdir -p "${STAGE}"
          # Fichiers embarqués (le reste est ignoré via .pkgmeta : .git, .github,
          # README, CHANGELOG, openspec…). Le zip se dézippe dans Interface/AddOns/.
          cp RCLootCouncil_GuildMastery.toc core.lua History.lua "${STAGE}/"
          cp -r Media "${STAGE}/"
          ( cd dist && zip -r "../${PKG}-${VERSION}.zip" "${PKG}" )
          echo "zip=${PKG}-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Extraire les notes de release depuis le CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## ${VERSION}" '
            index($0, v) == 1 { flag=1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "RCLootCouncil_GuildMastery ${VERSION}" > RELEASE_NOTES.md
          fi

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
