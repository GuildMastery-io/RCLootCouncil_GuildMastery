name: Release

# On every `vX.Y.Z` tag: package the addon (per .pkgmeta) and publish it to the
# GitHub release AND to CurseForge — via the standard WoW addon packager.
#
# CurseForge upload activates automatically once BOTH of these are present:
#   * a `## X-Curse-Project-ID: <id>` line in RCLootCouncil_GuildMastery.toc
#   * a repository secret named `CF_API_KEY` (authors.curseforge.com -> API Tokens)
# Until then the packager simply skips CurseForge and still makes the GitHub release.
#
# To also publish to WoWInterface / Wago later: add the matching toc id
# (`## X-WoWI-ID:` / `## X-Wago-ID:`) and the `WOWI_API_TOKEN` / `WAGO_API_TOKEN`
# secret — no workflow change needed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # packager needs full history + tags for the changelog

      - name: Verify tag matches .toc version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TOC_VERSION="$(grep -iE '^## Version:' RCLootCouncil_GuildMastery.toc | sed 's/.*: *//' | tr -d '\r' | xargs)"
          echo "tag=$VERSION  toc=$TOC_VERSION"
          if [ "$VERSION" != "$TOC_VERSION" ]; then
            echo "::error::Tag ($VERSION) does not match the .toc version ($TOC_VERSION). Align both before tagging."
            exit 1
          fi

      # BigWigsMods/packager uploads the zip to an EXISTING GitHub release; it does
      # not create one. So create it first (idempotent) with the CHANGELOG section
      # as notes, then the packager attaches the zip to it (and uploads to CurseForge).
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v v="## ${VERSION}" 'index($0,v)==1{f=1;next} /^## /&&f{exit} f{print}' CHANGELOG.md)"
          [ -z "$NOTES" ] && NOTES="RCLootCouncil_GuildMastery ${VERSION}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — packager will attach the zip."
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "$NOTES"
          fi

      - name: Package + publish (attach zip to GitHub release + CurseForge)
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      # The packager reliably uploads to CurseForge but does NOT re-attach the zip
      # to a release we pre-created above (it only attaches to releases it creates
      # itself) -- so the GitHub release would otherwise have no downloadable zip.
      # Attach it explicitly from .release/ where the packager left it. Idempotent.
      - name: Attach packaged zip to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="$(ls .release/*.zip 2>/dev/null | head -n1)"
          if [ -z "$ZIP" ]; then
            echo "::error::No packaged zip found in .release/ -- packager output changed?"
            exit 1
          fi
          echo "Attaching $ZIP to ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" "$ZIP" --clobber
